<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set a new password — Fleet Priority</title>
<link rel="stylesheet" href="/style.css">
<script>(function(){var m=localStorage.getItem('fp_theme');var t=(m==='light'||m==='dark')?m:((window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light');document.documentElement.setAttribute('data-theme',t);})();</script>
</head>
<body>
<button class="theme-toggle" id="themeToggle" data-theme-toggle style="position:fixed;top:16px;right:16px;"></button>
<div class="center-shell">
  <div style="width:100%;max-width:380px;">
    <div class="brand-row"><img src="/logo.svg" alt="Fleet Priority" class="brand-logo brand-logo-lg"></div>
    <div class="card">
      <h2>Set a new password</h2>
      <p class="sub" id="subText">Choose a new password for your account.</p>
      <div class="error-box" id="errorBox"></div>
      <div class="success-box" id="successBox"></div>
      <form id="resetForm">
        <div class="field"><label>New password</label><input type="password" id="newPassword" required minlength="8" autocomplete="new-password"></div>
        <div class="field"><label>Confirm new password</label><input type="password" id="confirmPassword" required minlength="8" autocomplete="new-password"></div>
        <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Update password</button>
      </form>
      <p class="hint" id="requestNewLink" style="display:none;"><a href="/forgot-password.html">Request a new reset link</a></p>
      <p class="hint">Remembered it? <a href="/login.html">Log in</a></p>
    </div>
  </div>
</div>
<script>
const errorBox = document.getElementById('errorBox');
const successBox = document.getElementById('successBox');
const resetForm = document.getElementById('resetForm');
const requestNewLink = document.getElementById('requestNewLink');
function showError(msg){ successBox.classList.remove('show'); errorBox.textContent = msg; errorBox.classList.add('show'); }
function showSuccess(msg){ errorBox.classList.remove('show'); successBox.textContent = msg; successBox.classList.add('show'); }

const params = new URLSearchParams(window.location.search);
const email = params.get('email') || '';
const token = params.get('token') || '';

if(!email || !token){
  document.getElementById('subText').textContent = 'This link is missing some information.';
  showError('This reset link looks incomplete. Please request a new one.');
  resetForm.style.display = 'none';
  requestNewLink.style.display = 'block';
}

resetForm.addEventListener('submit', async (e)=>{
  e.preventDefault();
  errorBox.classList.remove('show');
  successBox.classList.remove('show');
  const newPassword = document.getElementById('newPassword').value;
  const confirmPassword = document.getElementById('confirmPassword').value;
  if(newPassword !== confirmPassword){
    showError('Passwords do not match.');
    return;
  }
  const submitBtn = document.getElementById('submitBtn');
  submitBtn.disabled = true; submitBtn.textContent = 'Updating…';
  try{
    const res = await fetch('/api/auth/reset-password', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ email, token, newPassword }),
    });
    const data = await res.json().catch(()=>({}));
    if(!res.ok){
      showError(data.error || 'This reset link is invalid or has expired.');
      requestNewLink.style.display = 'block';
      return;
    }
    showSuccess('Password updated! Taking you to your dashboard…');
    resetForm.style.display = 'none';
    setTimeout(()=>{ window.location.href = '/app.html'; }, 1200);
  }catch(err){
    showError('Something went wrong. Please try again.');
  }finally{
    submitBtn.disabled = false; submitBtn.textContent = 'Update password';
  }
});
</script>
<script src="/theme.js"></script>
</body>
</html>
