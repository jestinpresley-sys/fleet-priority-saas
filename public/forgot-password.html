<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset your password — Fleet Priority</title>
<link rel="stylesheet" href="/style.css">
<script>(function(){var m=localStorage.getItem('fp_theme');var t=(m==='light'||m==='dark')?m:((window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light');document.documentElement.setAttribute('data-theme',t);})();</script>
</head>
<body>
<button class="theme-toggle" id="themeToggle" data-theme-toggle style="position:fixed;top:16px;right:16px;"></button>
<div class="center-shell">
  <div style="width:100%;max-width:380px;">
    <div class="brand-row"><img src="/logo.svg" alt="Fleet Priority" class="brand-logo brand-logo-lg"></div>
    <div class="card">
      <h2>Forgot your password?</h2>
      <p class="sub">Enter your email and we'll send you a reset link.</p>
      <div class="error-box" id="errorBox"></div>
      <div class="success-box" id="successBox"></div>
      <form id="forgotForm">
        <div class="field"><label>Email</label><input type="email" id="email" required autocomplete="email"></div>
        <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Send reset link</button>
      </form>
      <p class="hint"><a href="/login.html">Back to log in</a></p>
    </div>
  </div>
</div>
<script>
const errorBox = document.getElementById('errorBox');
const successBox = document.getElementById('successBox');
function showError(msg){ successBox.classList.remove('show'); errorBox.textContent = msg; errorBox.classList.add('show'); }
function showSuccess(msg){ errorBox.classList.remove('show'); successBox.textContent = msg; successBox.classList.add('show'); }

document.getElementById('forgotForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  errorBox.classList.remove('show');
  successBox.classList.remove('show');
  const submitBtn = document.getElementById('submitBtn');
  submitBtn.disabled = true; submitBtn.textContent = 'Sending…';
  try{
    const res = await fetch('/api/auth/forgot-password', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ email: document.getElementById('email').value }),
    });
    const data = await res.json().catch(()=>({}));
    if(!res.ok){ showError(data.error || 'Something went wrong. Please try again.'); return; }
    showSuccess("If an account exists for that email, we've sent a reset link. Check your inbox.");
    document.getElementById('forgotForm').reset();
  }catch(err){
    showError('Something went wrong. Please try again.');
  }finally{
    submitBtn.disabled = false; submitBtn.textContent = 'Send reset link';
  }
});
</script>
<script src="/theme.js"></script>
</body>
</html>
