<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fleet Overview — Fleet Priority</title>
<script>(function(){var t=localStorage.getItem('fp_theme')||((window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches)?'light':'dark');document.documentElement.setAttribute('data-theme',t);if(localStorage.getItem('fp_sidebar')==='collapsed')document.documentElement.setAttribute('data-sidebar','collapsed');})();</script>
<style>
  :root{
    --bg:#0f1420;
    --panel:#171d2b;
    --panel-2:#1e2536;
    --border:#2a3245;
    --text:#e8ecf4;
    --text-dim:#8b93a7;
    --accent:#4f7fff;
    --accent-dim:#2c3d6b;
    --green:#3ecf8e;
    --amber:#f5b94b;
    --red:#f0665f;
    --btn-secondary-hover:#232b3f;
    --radius:10px;
  }
  :root[data-theme="light"]{
    --bg:#f4f6fb;
    --panel:#ffffff;
    --panel-2:#eef1f7;
    --border:#dde3ee;
    --text:#161b26;
    --text-dim:#667085;
    --accent:#3b5fe0;
    --accent-dim:#c3d0f7;
    --green:#1f9d63;
    --amber:#b3790a;
    --red:#d1453c;
    --btn-secondary-hover:#e2e7f0;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
  }
  /* Sidebar layout */
  .layout{display:flex;align-items:stretch;min-height:100vh;}
  .sidebar{
    width:230px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--border);
    display:flex;flex-direction:column;padding:14px 12px;transition:width .18s ease;
    position:sticky;top:0;height:100vh;overflow-x:hidden;overflow-y:auto;
  }
  .sidebar-top{display:flex;justify-content:flex-end;margin-bottom:10px;}
  .sidebar-collapse-btn{
    display:flex;align-items:center;justify-content:center;width:28px;height:28px;padding:0;
    background:none;color:var(--text-dim);border:1px solid var(--border);border-radius:7px;cursor:pointer;flex-shrink:0;
  }
  .sidebar-collapse-btn:hover{background:var(--btn-secondary-hover);color:var(--text);}
  .sidebar-collapse-btn svg{transition:transform .18s ease;}
  .sidebar-user{padding:6px 8px 14px;border-bottom:1px solid var(--border);margin-bottom:10px;}
  .sidebar-email{font-size:12.5px;color:var(--text);word-break:break-all;margin-bottom:7px;line-height:1.4;}
  .sidebar-nav{display:flex;flex-direction:column;gap:3px;flex:1;}
  .sidebar-link{
    display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:8px;
    color:var(--text-dim);font-size:13.5px;font-weight:600;text-decoration:none;
    background:none;border:none;cursor:pointer;width:100%;text-align:left;font-family:inherit;
  }
  .sidebar-link:hover{background:var(--panel-2);color:var(--text);}
  .sidebar-link svg{flex-shrink:0;width:18px;height:18px;}
  .sidebar-label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .sidebar-footer{border-top:1px solid var(--border);padding-top:10px;margin-top:10px;}
  .main-content{flex:1;min-width:0;}
  .mobile-menu-btn{
    display:none;align-items:center;justify-content:center;width:38px;height:38px;padding:0;
    background:var(--panel-2);color:var(--text);border:1px solid var(--border);border-radius:8px;
    cursor:pointer;flex-shrink:0;
  }
  .sidebar-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:199;display:none;}

  @media (min-width:769px){
    html[data-sidebar="collapsed"] .sidebar{width:60px;padding:14px 8px;}
    html[data-sidebar="collapsed"] .sidebar-top{justify-content:center;}
    html[data-sidebar="collapsed"] .sidebar-collapse-btn svg{transform:rotate(180deg);}
    html[data-sidebar="collapsed"] .sidebar-user{display:flex;flex-direction:column;align-items:center;padding:6px 0 14px;}
    html[data-sidebar="collapsed"] .sidebar-email{display:none;}
    html[data-sidebar="collapsed"] .sidebar-label{display:none;}
    html[data-sidebar="collapsed"] .sidebar-link{justify-content:center;padding:9px;}
  }

  @media (max-width:768px){
    .sidebar{
      position:fixed;top:0;left:0;width:250px;max-width:82vw;height:100vh;
      z-index:200;transform:translateX(-100%);box-shadow:8px 0 30px rgba(0,0,0,0.4);
    }
    .sidebar.mobile-open{transform:translateX(0);}
    .sidebar-collapse-btn{display:none;}
    .mobile-menu-btn{display:flex;}
    .sidebar-backdrop.open{display:block;}
  }

  .plan-badge{
    font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;
    padding:3px 9px;border-radius:20px;background:rgba(79,127,255,0.15);color:var(--accent);
  }
  .btn{
    border:none;border-radius:8px;padding:10px 16px;font-size:14px;font-weight:600;
    cursor:pointer;transition:filter .15s ease,transform .05s ease;
  }
  .btn:active{transform:scale(0.97);}
  .btn-secondary{background:var(--panel-2);color:var(--text);border:1px solid var(--border);}
  .btn-secondary:hover{background:var(--btn-secondary-hover);}
  .btn-sm{padding:6px 10px;font-size:12.5px;}

  .app{max-width:1200px;margin:0 auto;padding:28px 24px 60px;}
  header{margin-bottom:22px;}
  header h1{margin:0;font-size:22px;letter-spacing:-0.02em;}
  header p{margin:4px 0 0;color:var(--text-dim);font-size:13px;}

  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:24px;}
  .stat{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;}
  .stat .num{font-size:22px;font-weight:700;letter-spacing:-0.02em;}
  .stat .label{font-size:12px;color:var(--text-dim);margin-top:2px;}
  .stat.spend .num{color:var(--green);}
  .stat.oil .num{color:var(--amber);}

  .charts-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;margin-bottom:24px;}
  .chart-card{
    background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
    padding:18px;
  }
  .chart-card h3{margin:0 0 4px;font-size:14px;}
  .chart-card p.sub{margin:0 0 16px;font-size:12px;color:var(--text-dim);}
  .chart-wrap{position:relative;height:220px;}
  .chart-empty{
    height:220px;display:flex;align-items:center;justify-content:center;
    color:var(--text-dim);font-size:13px;text-align:center;padding:0 20px;
  }

  .activity-card{
    background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:18px;
  }
  .activity-card h3{margin:0 0 14px;font-size:14px;}
  table.activity{width:100%;border-collapse:collapse;font-size:13px;}
  table.activity th{
    text-align:left;color:var(--text-dim);font-weight:600;font-size:11px;text-transform:uppercase;
    letter-spacing:0.04em;padding:0 10px 8px;border-bottom:1px solid var(--border);
  }
  table.activity td{padding:9px 10px;border-bottom:1px solid var(--border);}
  table.activity tr:last-child td{border-bottom:none;}
  table.activity .cost{color:var(--green);font-weight:600;text-align:right;}
  .empty-note{color:var(--text-dim);font-size:13px;padding:20px 0;text-align:center;}
</style>
</head>
<body>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <button class="sidebar-collapse-btn" id="sidebarCollapseBtn" title="Collapse sidebar" aria-label="Collapse sidebar">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="11 17 6 12 11 7"/><polyline points="18 17 13 12 18 7"/></svg>
      </button>
    </div>
    <div class="sidebar-user">
      <div class="sidebar-email" id="userEmail">—</div>
      <span class="plan-badge" id="planBadge">PLAN</span>
    </div>
    <nav class="sidebar-nav">
      <a href="/app.html" class="sidebar-link" title="Back to fleet">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        <span class="sidebar-label">Back to fleet</span>
      </a>
      <button class="sidebar-link" id="themeToggle" data-theme-toggle>
        <span class="theme-toggle-icon"></span>
        <span class="sidebar-label theme-toggle-label">Theme</span>
      </button>
    </nav>
    <div class="sidebar-footer">
      <button class="sidebar-link" id="logoutBtn" title="Log out">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        <span class="sidebar-label">Log out</span>
      </button>
    </div>
  </aside>
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
  <div class="main-content">
  <div class="app">
    <header style="display:flex;align-items:flex-start;gap:12px;">
      <button class="mobile-menu-btn" id="mobileMenuBtn" title="Open menu" aria-label="Open menu">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div>
        <h1>Fleet overview</h1>
        <p>Spending trends and totals across your whole fleet.</p>
      </div>
    </header>

    <div class="stats" id="stats"></div>

    <div class="charts-grid">
      <div class="chart-card">
        <h3>Spend by service type</h3>
        <p class="sub">All-time maintenance cost, grouped by category.</p>
        <div class="chart-wrap" id="spendChartWrap"><canvas id="spendChart"></canvas></div>
      </div>
      <div class="chart-card">
        <h3>Oil change cost trend</h3>
        <p class="sub">Average oil change cost by month, across the fleet.</p>
        <div class="chart-wrap" id="oilChartWrap"><canvas id="oilChart"></canvas></div>
      </div>
    </div>

    <div class="activity-card">
      <h3>Recent maintenance activity</h3>
      <div id="activityBody"></div>
    </div>
  </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.0/chart.umd.min.js"></script>
<script>
(function(){
  async function api(path, opts){
    opts = opts || {};
    const res = await fetch(path, { headers: { 'Content-Type': 'application/json' }, ...opts });
    let data = {};
    try{ data = await res.json(); }catch(e){}
    if(!res.ok){
      const err = new Error(data.error || ('Request failed (' + res.status + ')'));
      err.status = res.status;
      throw err;
    }
    return data;
  }

  function escapeHtml(str){
    if(str===undefined || str===null) return '';
    return String(str).replace(/[&<>"']/g, s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
  }
  function money(n){
    const num = Number(n) || 0;
    return '$' + num.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  document.getElementById('logoutBtn').addEventListener('click', async ()=>{
    await api('/api/auth/logout', { method:'POST' });
    window.location.href = '/login.html';
  });

  const sidebarCollapseBtn = document.getElementById('sidebarCollapseBtn');
  function updateSidebarCollapseLabel(){
    const collapsed = document.documentElement.getAttribute('data-sidebar') === 'collapsed';
    const label = collapsed ? 'Expand sidebar' : 'Collapse sidebar';
    sidebarCollapseBtn.setAttribute('title', label);
    sidebarCollapseBtn.setAttribute('aria-label', label);
  }
  updateSidebarCollapseLabel();
  sidebarCollapseBtn.addEventListener('click', ()=>{
    const collapsed = document.documentElement.getAttribute('data-sidebar') === 'collapsed';
    if(collapsed){
      document.documentElement.removeAttribute('data-sidebar');
      localStorage.setItem('fp_sidebar', 'expanded');
    }else{
      document.documentElement.setAttribute('data-sidebar', 'collapsed');
      localStorage.setItem('fp_sidebar', 'collapsed');
    }
    updateSidebarCollapseLabel();
  });

  const sidebarEl = document.getElementById('sidebar');
  const sidebarBackdrop = document.getElementById('sidebarBackdrop');
  const mobileMenuBtn = document.getElementById('mobileMenuBtn');
  function openMobileSidebar(){
    sidebarEl.classList.add('mobile-open');
    sidebarBackdrop.classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function closeMobileSidebar(){
    sidebarEl.classList.remove('mobile-open');
    sidebarBackdrop.classList.remove('open');
    document.body.style.overflow = '';
  }
  mobileMenuBtn.addEventListener('click', openMobileSidebar);
  sidebarBackdrop.addEventListener('click', closeMobileSidebar);
  document.addEventListener('keydown', (e)=>{ if(e.key === 'Escape') closeMobileSidebar(); });

  function isActive(user){
    return user && (user.subscriptionStatus === 'active' || user.subscriptionStatus === 'trialing');
  }

  function buildSpendByType(records){
    const totals = {};
    records.forEach(r=>{
      const t = r.type || 'Other';
      totals[t] = (totals[t] || 0) + (Number(r.cost) || 0);
    });
    return totals;
  }

  function buildOilChangeTrend(records){
    const oil = records.filter(r => r.type === 'Oil Change' && r.date);
    const byMonth = {};
    oil.forEach(r=>{
      const month = r.date.slice(0,7); // 'YYYY-MM'
      if(!byMonth[month]) byMonth[month] = { sum: 0, count: 0 };
      byMonth[month].sum += Number(r.cost) || 0;
      byMonth[month].count += 1;
    });
    const months = Object.keys(byMonth).sort();
    return {
      labels: months,
      values: months.map(m => Math.round((byMonth[m].sum / byMonth[m].count) * 100) / 100),
    };
  }

  function renderStats(vehicles, records){
    const totalVehicles = vehicles.length;
    const totalMileage = vehicles.reduce((s,v)=> s + (Number(v.mileage) || 0), 0);
    const totalSpend = records.reduce((s,r)=> s + (Number(r.cost) || 0), 0);
    const oilRecords = records.filter(r => r.type === 'Oil Change');
    const oilSpend = oilRecords.reduce((s,r)=> s + (Number(r.cost) || 0), 0);
    const avgOil = oilRecords.length ? oilSpend / oilRecords.length : 0;

    document.getElementById('stats').innerHTML = `
      <div class="stat"><div class="num">${totalVehicles}</div><div class="label">Total vehicles</div></div>
      <div class="stat"><div class="num">${totalMileage.toLocaleString()}</div><div class="label">Total fleet mileage</div></div>
      <div class="stat spend"><div class="num">${money(totalSpend)}</div><div class="label">Total maintenance spend</div></div>
      <div class="stat oil"><div class="num">${money(oilSpend)}</div><div class="label">Total oil change spend</div></div>
      <div class="stat oil"><div class="num">${money(avgOil)}</div><div class="label">Avg. cost per oil change</div></div>
    `;
  }

  function cssVar(name){
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  }

  let spendChartInstance = null;
  let oilChartInstance = null;
  let lastSpendTotals = null;
  let lastOilTrend = null;

  function renderSpendChart(totals){
    lastSpendTotals = totals;
    const wrap = document.getElementById('spendChartWrap');
    const entries = Object.entries(totals).sort((a,b)=> b[1]-a[1]);
    if(spendChartInstance){ spendChartInstance.destroy(); spendChartInstance = null; }
    if(entries.length === 0){
      wrap.innerHTML = '<div class="chart-empty">No maintenance records yet — log some to see spend by category.</div>';
      return;
    }
    wrap.innerHTML = '<canvas id="spendChart"></canvas>';
    const ctx = document.getElementById('spendChart').getContext('2d');
    const textDim = cssVar('--text-dim');
    const border = cssVar('--border');
    spendChartInstance = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: entries.map(e=>e[0]),
        datasets: [{
          label: 'Spend',
          data: entries.map(e=> Math.round(e[1]*100)/100),
          backgroundColor: cssVar('--accent'),
          borderRadius: 4,
        }],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { ticks: { color: textDim }, grid: { color: border } },
          y: { ticks: { color: textDim }, grid: { color: border }, beginAtZero: true },
        },
      },
    });
  }

  function renderOilChart(trend){
    lastOilTrend = trend;
    const wrap = document.getElementById('oilChartWrap');
    if(oilChartInstance){ oilChartInstance.destroy(); oilChartInstance = null; }
    if(trend.labels.length === 0){
      wrap.innerHTML = '<div class="chart-empty">No oil change records yet — log a few to see the cost trend over time.</div>';
      return;
    }
    wrap.innerHTML = '<canvas id="oilChart"></canvas>';
    const ctx = document.getElementById('oilChart').getContext('2d');
    const textDim = cssVar('--text-dim');
    const border = cssVar('--border');
    const amber = cssVar('--amber');
    oilChartInstance = new Chart(ctx, {
      type: 'line',
      data: {
        labels: trend.labels,
        datasets: [{
          label: 'Avg. oil change cost',
          data: trend.values,
          borderColor: amber,
          backgroundColor: amber + '26',
          tension: 0.25,
          fill: true,
          pointRadius: 3,
        }],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { ticks: { color: textDim }, grid: { color: border } },
          y: { ticks: { color: textDim }, grid: { color: border }, beginAtZero: true },
        },
      },
    });
  }

  document.addEventListener('fp-theme-change', function(){
    if(lastSpendTotals) renderSpendChart(lastSpendTotals);
    if(lastOilTrend) renderOilChart(lastOilTrend);
  });

  function renderActivity(vehicles, records){
    const body = document.getElementById('activityBody');
    if(records.length === 0){
      body.innerHTML = '<p class="empty-note">No maintenance records yet.</p>';
      return;
    }
    const vehicleById = {};
    vehicles.forEach(v => { vehicleById[v.id] = v; });
    const sorted = records.slice().sort((a,b)=> (b.date||'').localeCompare(a.date||'')).slice(0,10);
    const rows = sorted.map(r=>{
      const v = vehicleById[r.vehicleId];
      const label = v ? `${escapeHtml(v.year)} ${escapeHtml(v.make)} ${escapeHtml(v.model)}` : 'Unknown vehicle';
      return `
        <tr>
          <td>${escapeHtml(r.date || '—')}</td>
          <td>${label}</td>
          <td>${escapeHtml(r.type || 'Other')}</td>
          <td class="cost">${money(r.cost)}</td>
        </tr>
      `;
    }).join('');
    body.innerHTML = `
      <table class="activity">
        <thead><tr><th>Date</th><th>Vehicle</th><th>Type</th><th style="text-align:right;">Cost</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    `;
  }

  async function init(){
    let user;
    try{
      ({ user } = await api('/api/auth/me'));
    }catch(e){
      window.location.href = '/login.html';
      return;
    }
    if(!isActive(user)){
      window.location.href = '/pricing.html';
      return;
    }
    document.getElementById('userEmail').textContent = user.email;
    document.getElementById('planBadge').textContent = (user.plan || 'plan').toUpperCase();

    let vehicles = [], records = [];
    try{
      const [vRes, mRes] = await Promise.all([ api('/api/vehicles'), api('/api/maintenance') ]);
      vehicles = vRes.vehicles || [];
      records = mRes.records || [];
    }catch(e){
      // leave empty — sections below render their own empty states
    }

    renderStats(vehicles, records);
    renderSpendChart(buildSpendByType(records));
    renderOilChart(buildOilChangeTrend(records));
    renderActivity(vehicles, records);
  }

  init();
})();
</script>
<script src="/theme.js"></script>
</body>
</html>
