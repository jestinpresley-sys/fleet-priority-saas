<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings — Fleet Priority</title>
<script>(function(){var m=localStorage.getItem('fp_theme');var t=(m==='light'||m==='dark')?m:((window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light');document.documentElement.setAttribute('data-theme',t);if(localStorage.getItem('fp_sidebar')==='collapsed')document.documentElement.setAttribute('data-sidebar','collapsed');})();</script>
<style>
  :root{
    --bg:#0f1420;
    --panel:#171d2b;
    --panel-2:#1e2536;
    --border:#2a3245;
    --text:#e8ecf4;
    --text-dim:#8b93a7;
    --accent:#4f7fff;
    --accent-dim:#2c3d6b;
    --green:#3ecf8e;
    --amber:#f5b94b;
    --red:#f0665f;
    --btn-secondary-hover:#232b3f;
    --radius:10px;
  }
  :root[data-theme="light"]{
    --bg:#f4f6fb;
    --panel:#ffffff;
    --panel-2:#eef1f7;
    --border:#dde3ee;
    --text:#161b26;
    --text-dim:#667085;
    --accent:#3b5fe0;
    --accent-dim:#c3d0f7;
    --green:#1f9d63;
    --amber:#b3790a;
    --red:#d1453c;
    --btn-secondary-hover:#e2e7f0;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
  }
  /* Sidebar layout */
  .layout{display:flex;align-items:stretch;min-height:100vh;}
  .sidebar{
    width:230px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--border);
    display:flex;flex-direction:column;padding:14px 12px;transition:width .18s ease;
    position:sticky;top:0;height:100vh;overflow-x:hidden;overflow-y:auto;
  }
  .sidebar-top{display:flex;justify-content:flex-end;margin-bottom:10px;}
  .sidebar-collapse-btn{
    display:flex;align-items:center;justify-content:center;width:28px;height:28px;padding:0;
    background:none;color:var(--text-dim);border:1px solid var(--border);border-radius:7px;cursor:pointer;flex-shrink:0;
  }
  .sidebar-collapse-btn:hover{background:var(--btn-secondary-hover);color:var(--text);}
  .sidebar-collapse-btn svg{transition:transform .18s ease;}
  .sidebar-user{padding:6px 8px 14px;border-bottom:1px solid var(--border);margin-bottom:10px;}
  .sidebar-name{font-size:13.5px;font-weight:700;color:var(--text);margin-bottom:2px;line-height:1.4;}
  .sidebar-email{font-size:12.5px;color:var(--text);word-break:break-all;margin-bottom:7px;line-height:1.4;}
  .sidebar-nav{display:flex;flex-direction:column;gap:3px;flex:1;}
  .sidebar-link{
    display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:8px;position:relative;
    color:var(--text-dim);font-size:13.5px;font-weight:600;text-decoration:none;
    background:none;border:none;cursor:pointer;width:100%;text-align:left;font-family:inherit;
  }
  .sidebar-link:hover{background:var(--panel-2);color:var(--text);}
  .sidebar-link svg{flex-shrink:0;width:18px;height:18px;}
  .sidebar-label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .sidebar-footer{border-top:1px solid var(--border);padding-top:10px;margin-top:10px;}
  .main-content{flex:1;min-width:0;}
  .mobile-menu-btn{
    display:none;align-items:center;justify-content:center;width:38px;height:38px;padding:0;
    background:var(--panel-2);color:var(--text);border:1px solid var(--border);border-radius:8px;
    cursor:pointer;flex-shrink:0;
  }
  .sidebar-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:199;display:none;}
  .notif-badge{
    display:inline-flex;align-items:center;justify-content:center;min-width:16px;height:16px;
    padding:0 4px;border-radius:20px;background:var(--red);color:#fff;font-size:10px;font-weight:700;
    margin-left:auto;
  }
  html[data-sidebar="collapsed"] .notif-badge{position:absolute;top:2px;right:2px;margin-left:0;}

  @media (min-width:769px){
    html[data-sidebar="collapsed"] .sidebar{width:60px;padding:14px 8px;}
    html[data-sidebar="collapsed"] .sidebar-top{justify-content:center;}
    html[data-sidebar="collapsed"] .sidebar-collapse-btn svg{transform:rotate(180deg);}
    html[data-sidebar="collapsed"] .sidebar-user{display:flex;flex-direction:column;align-items:center;padding:6px 0 14px;}
    html[data-sidebar="collapsed"] .sidebar-name{display:none;}
    html[data-sidebar="collapsed"] .sidebar-email{display:none;}
    html[data-sidebar="collapsed"] .sidebar-label{display:none;}
    html[data-sidebar="collapsed"] .sidebar-link{justify-content:center;padding:9px;}
  }

  @media (max-width:768px){
    .sidebar{
      position:fixed;top:0;left:0;width:250px;max-width:82vw;height:100vh;
      z-index:200;transform:translateX(-100%);box-shadow:8px 0 30px rgba(0,0,0,0.4);
    }
    .sidebar.mobile-open{transform:translateX(0);}
    .sidebar-collapse-btn{display:none;}
    .mobile-menu-btn{display:flex;}
    .sidebar-backdrop.open{display:block;}
  }

  .plan-badge{
    font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;
    padding:3px 9px;border-radius:20px;background:rgba(79,127,255,0.15);color:var(--accent);
  }

  .app{max-width:640px;margin:0 auto;padding:28px 24px 60px;}
  header{margin-bottom:22px;}
  header h1{margin:0;font-size:22px;letter-spacing:-0.02em;}
  header p{margin:4px 0 0;color:var(--text-dim);font-size:13px;}

  .settings-card{
    background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
    padding:20px 22px;
  }
  .settings-card h3{margin:0 0 4px;font-size:15px;}
  .settings-card p.sub{margin:0 0 18px;font-size:12.5px;color:var(--text-dim);}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:12px;color:var(--text-dim);margin-bottom:5px;font-weight:600;}
  .field input{
    width:100%;background:var(--panel-2);border:1px solid var(--border);border-radius:7px;
    padding:9px 11px;color:var(--text);font-size:13.5px;font-family:inherit;outline:none;
  }
  .field input:focus{border-color:var(--accent);}
  .field input:disabled{color:var(--text-dim);cursor:default;}
  .settings-actions{display:flex;align-items:center;gap:12px;margin-top:4px;}
  .btn{
    border:none;border-radius:8px;padding:10px 16px;font-size:14px;font-weight:600;
    cursor:pointer;transition:filter .15s ease,transform .05s ease;
  }
  .btn:active{transform:scale(0.97);}
  .btn:disabled{opacity:0.6;cursor:default;}
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-primary:hover{filter:brightness(1.1);}
  .settings-status{font-size:12.5px;}
  .settings-status.ok{color:var(--green);}
  .settings-status.err{color:var(--red);}
  .theme-mode-row{display:flex;gap:8px;}
  .theme-mode-btn{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;
    padding:14px 10px;border-radius:8px;border:1px solid var(--border);background:var(--panel-2);
    color:var(--text-dim);cursor:pointer;font-size:12.5px;font-weight:600;font-family:inherit;
  }
  .theme-mode-btn svg{width:20px;height:20px;flex-shrink:0;}
  .theme-mode-btn:hover{background:var(--btn-secondary-hover);}
  .theme-mode-btn.active{border-color:var(--accent);color:var(--accent);background:rgba(79,127,255,0.08);}
</style>
</head>
<body>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <button class="sidebar-collapse-btn" id="sidebarCollapseBtn" title="Collapse sidebar" aria-label="Collapse sidebar">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="11 17 6 12 11 7"/><polyline points="18 17 13 12 18 7"/></svg>
      </button>
    </div>
    <div class="sidebar-user">
      <div class="sidebar-name" id="userName" style="display:none;"></div>
      <div class="sidebar-email" id="userEmail">—</div>
      <span class="plan-badge" id="planBadge">PLAN</span>
    </div>
    <nav class="sidebar-nav">
      <a href="/app.html" class="sidebar-link" title="Back to fleet">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        <span class="sidebar-label">Back to fleet</span>
      </a>
      <a href="/overview.html" class="sidebar-link" title="Fleet overview">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        <span class="sidebar-label">Fleet overview</span>
      </a>
      <a href="/notifications.html" class="sidebar-link" title="Notifications">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        <span class="sidebar-label">Notifications</span>
        <span class="notif-badge" id="notifBadge" style="display:none;">0</span>
      </a>
      <button class="sidebar-link" id="themeToggle" data-theme-toggle>
        <span class="theme-toggle-icon"></span>
        <span class="sidebar-label theme-toggle-label">Theme</span>
      </button>
    </nav>
    <div class="sidebar-footer">
      <button class="sidebar-link" id="logoutBtn" title="Log out">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        <span class="sidebar-label">Log out</span>
      </button>
    </div>
  </aside>
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
  <div class="main-content">
  <div class="app">
    <header style="display:flex;align-items:flex-start;gap:12px;">
      <button class="mobile-menu-btn" id="mobileMenuBtn" title="Open menu" aria-label="Open menu">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div>
        <h1>Settings</h1>
        <p>Manage your profile and account preferences.</p>
      </div>
    </header>

    <div class="settings-card">
      <h3>Profile</h3>
      <p class="sub">This name shows in the sidebar instead of your email.</p>
      <form id="profileForm">
        <div class="field"><label>Name</label><input type="text" id="f_name" placeholder="Your name" maxlength="100"></div>
        <div class="field"><label>Email</label><input type="email" id="f_email" disabled></div>
        <div class="settings-actions">
          <button type="submit" class="btn btn-primary" id="profileSaveBtn">Save changes</button>
          <span class="settings-status" id="profileStatus"></span>
        </div>
      </form>
    </div>

    <div class="settings-card" style="margin-top:20px;">
      <h3>Appearance</h3>
      <p class="sub">Choose a theme, or match your device's setting automatically.</p>
      <div class="theme-mode-row">
        <button type="button" class="theme-mode-btn" data-theme-mode="light">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.4M12 19.1v2.4M4.2 4.2l1.7 1.7M18.1 18.1l1.7 1.7M2.5 12h2.4M19.1 12h2.4M4.2 19.8l1.7-1.7M18.1 5.9l1.7-1.7"/></svg>
          <span>Light</span>
        </button>
        <button type="button" class="theme-mode-btn" data-theme-mode="dark">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.8 6.8 0 0 0 10.5 10.5z"/></svg>
          <span>Dark</span>
        </button>
        <button type="button" class="theme-mode-btn" data-theme-mode="system">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><line x1="8" y1="20" x2="16" y2="20"/><line x1="12" y1="16" x2="12" y2="20"/></svg>
          <span>System</span>
        </button>
      </div>
    </div>
  </div>
  </div>
</div>

<script>
(function(){
  async function api(path, opts){
    opts = opts || {};
    const res = await fetch(path, { headers: { 'Content-Type': 'application/json' }, ...opts });
    let data = {};
    try{ data = await res.json(); }catch(e){}
    if(!res.ok){
      const err = new Error(data.error || ('Request failed (' + res.status + ')'));
      err.status = res.status;
      throw err;
    }
    return data;
  }

  document.getElementById('logoutBtn').addEventListener('click', async ()=>{
    await api('/api/auth/logout', { method:'POST' });
    window.location.href = '/login.html';
  });

  const sidebarCollapseBtn = document.getElementById('sidebarCollapseBtn');
  function updateSidebarCollapseLabel(){
    const collapsed = document.documentElement.getAttribute('data-sidebar') === 'collapsed';
    const label = collapsed ? 'Expand sidebar' : 'Collapse sidebar';
    sidebarCollapseBtn.setAttribute('title', label);
    sidebarCollapseBtn.setAttribute('aria-label', label);
  }
  updateSidebarCollapseLabel();
  sidebarCollapseBtn.addEventListener('click', ()=>{
    const collapsed = document.documentElement.getAttribute('data-sidebar') === 'collapsed';
    if(collapsed){
      document.documentElement.removeAttribute('data-sidebar');
      localStorage.setItem('fp_sidebar', 'expanded');
    }else{
      document.documentElement.setAttribute('data-sidebar', 'collapsed');
      localStorage.setItem('fp_sidebar', 'collapsed');
    }
    updateSidebarCollapseLabel();
  });

  const sidebarEl = document.getElementById('sidebar');
  const sidebarBackdrop = document.getElementById('sidebarBackdrop');
  const mobileMenuBtn = document.getElementById('mobileMenuBtn');
  function openMobileSidebar(){
    sidebarEl.classList.add('mobile-open');
    sidebarBackdrop.classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function closeMobileSidebar(){
    sidebarEl.classList.remove('mobile-open');
    sidebarBackdrop.classList.remove('open');
    document.body.style.overflow = '';
  }
  mobileMenuBtn.addEventListener('click', openMobileSidebar);
  sidebarBackdrop.addEventListener('click', closeMobileSidebar);
  document.addEventListener('keydown', (e)=>{ if(e.key === 'Escape') closeMobileSidebar(); });

  function isActive(user){
    return user && (user.subscriptionStatus === 'active' || user.subscriptionStatus === 'trialing');
  }

  function applyUserToSidebar(user){
    const nameEl = document.getElementById('userName');
    nameEl.textContent = user.name || '';
    nameEl.style.display = user.name ? 'block' : 'none';
    document.getElementById('userEmail').textContent = user.email;
    document.getElementById('planBadge').textContent = (user.plan || 'plan').toUpperCase();
  }

  const profileForm = document.getElementById('profileForm');
  const profileSaveBtn = document.getElementById('profileSaveBtn');
  const profileStatus = document.getElementById('profileStatus');

  profileForm.addEventListener('submit', async (e)=>{
    e.preventDefault();
    profileStatus.textContent = '';
    profileStatus.className = 'settings-status';
    profileSaveBtn.disabled = true;
    profileSaveBtn.textContent = 'Saving…';
    try{
      const { user } = await api('/api/auth/profile', {
        method: 'PUT',
        body: JSON.stringify({ name: document.getElementById('f_name').value }),
      });
      applyUserToSidebar(user);
      profileStatus.textContent = 'Saved.';
      profileStatus.className = 'settings-status ok';
    }catch(err){
      profileStatus.textContent = err.message;
      profileStatus.className = 'settings-status err';
    }finally{
      profileSaveBtn.disabled = false;
      profileSaveBtn.textContent = 'Save changes';
    }
  });

  async function init(){
    let user;
    try{
      ({ user } = await api('/api/auth/me'));
    }catch(e){
      window.location.href = '/login.html';
      return;
    }
    if(!isActive(user)){
      window.location.href = '/pricing.html';
      return;
    }
    applyUserToSidebar(user);
    document.getElementById('f_name').value = user.name || '';
    document.getElementById('f_email').value = user.email;
    if(window.FPNotif) window.FPNotif.refreshBadge();
  }

  init();
})();
</script>
<script src="/theme.js"></script>
<script src="/notifications-badge.js"></script>
</body>
</html>
